<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La Content-Security-Policy est injectée au build par cspPlugin()
         (@mister-guiiug/dev-pwa-config/vite-csp) : script-src par hash SHA-256
         des scripts inline, plus de 'unsafe-inline'. -->
    <!-- Le script anti-FOUC est injecté en tête de <head> par pwaSeoPlugin()
         (option themeBoot, @mister-guiiug/dev-pwa-config/theme-boot) : clé
         dwc_theme, migration depuis l'ancienne clé mb_theme. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/icon-512.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- <meta name="theme-color"> : deux balises par schéma (attribut media)
         injectées par pwaSeoPlugin() via l'option themeColor. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Miss Badminton" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />
    <meta
      name="description"
      content="Comptez les points d'un match de badminton, en simple ou en double : score en direct, changement de côté, historique et statistiques. Gratuit, hors ligne."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Badminton" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Miss Badminton — compteur de score de badminton"
    />
    <meta
      property="og:description"
      content="Comptez les points d'un match de badminton, en simple ou en double : score en direct, changement de côté, historique et statistiques. Gratuit, hors ligne."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Miss Badminton — compteur de score de badminton"
    />
    <meta
      name="twitter:description"
      content="Comptez les points d'un match de badminton, en simple ou en double : score en direct, changement de côté, historique et statistiques. Gratuit, hors ligne."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />

    <!--
      LES MARQUEURS `__ANALYTICS_*__` ONT ÉTÉ RETIRÉS.

      `pwaSeoPlugin` les remplaçait AU BUILD par le tag de Google dès
      qu'un identifiant était posé — précédé d'un `consent default` tout
      refusé, donc sans collecte, mais le script partait quand même au
      chargement de la page.

      `ConsentBanner`, monté depuis la campagne de mesure, fait le même
      travail autrement : il n'injecte RIEN avant l'accord. Garder les deux
      chemins ferait partir DEUX tags le jour où la variable serait posée.
      Le socle porte deux réponses à la même question ; cette app
      n'en garde qu'une.
    -->
    <title>Miss Badminton — compteur de score de badminton</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
