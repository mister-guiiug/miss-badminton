<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Miss Badminton"
>
  <!--
    LA MÊME RAQUETTE, ALLÉGÉE POUR 16 PIXELS. Ce fichier n'est pas une autre
    marque : c'est `logo.svg` moins ce qui ne survit pas à l'onglet. Le
    cordage disparaît (dix traits d'un pixel deviennent un gris sale), le
    tamis épaissit, le volant grossit d'un tiers. À 128 px on ne verrait
    presque pas la différence ; à 16, c'est celle entre une raquette et une
    tache.
  -->
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />

  <g transform="rotate(-20 32 32)">
    <ellipse
      cx="32"
      cy="25"
      rx="13.5"
      ry="15.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="5"
    />
    <path
      d="M 32 40 V 49"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round"
    />
    <g transform="translate(32 24) scale(0.55)">
      <path d="M -0.74 -4.32 L -10.1 -22.13 L -16.74 -17.66 L -3.73 -2.31 Z" fill="#ffffff" />
      <path d="M 1.8 -4 L 4 -24 L -4 -24 L -1.8 -4 Z" fill="#ffffff" />
      <path d="M 3.73 -2.31 L 16.74 -17.66 L 10.1 -22.13 L 0.74 -4.32 Z" fill="#ffffff" />
      <circle cx="0" cy="4" r="8" fill="#fbbf24" />
    </g>
  </g>
</svg>
