<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Miss Badminton"
>
  <defs>
    <linearGradient id="mb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="mb-feath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <radialGradient id="mb-cork" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#mb-bg)" />

  <!-- Sillage du volant : arc subtil -->
  <path
    d="M 6 52 Q 24 12 58 10"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-dasharray="1.5 4"
  />

  <!-- Volant orienté en diagonale -->
  <g transform="rotate(-22 32 34)">
    <!-- Plumes en éventail (5 plumes) -->
    <g
      fill="url(#mb-feath)"
      stroke="#94a3b8"
      stroke-width="0.7"
      stroke-linejoin="round"
    >
      <path d="M 32 40 L 18 16 L 23 14 Z" />
      <path d="M 32 40 L 25 12 L 30 11 Z" />
      <path d="M 32 40 L 30 10 L 34 10 Z" />
      <path d="M 32 40 L 34 11 L 39 12 Z" />
      <path d="M 32 40 L 41 14 L 46 16 Z" />
    </g>

    <!-- Anneau jupe (suggère la couture du volant) -->
    <ellipse
      cx="32"
      cy="40"
      rx="9"
      ry="2.5"
      fill="none"
      stroke="rgba(100,116,139,0.6)"
      stroke-width="0.7"
    />

    <!-- Tête (cork ball) -->
    <ellipse
      cx="32"
      cy="46"
      rx="7"
      ry="6"
      fill="url(#mb-cork)"
      stroke="#b45309"
      stroke-width="1.2"
    />
    <!-- Reflet -->
    <ellipse
      cx="29"
      cy="43"
      rx="2.5"
      ry="1.4"
      fill="rgba(255,255,255,0.65)"
    />
  </g>
</svg>
