# CI déléguée au reusable workflow famille (dev-pwa-config).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # `doctor-strict` reste à `false`, et voici pourquoi. Mesuré le 19/09/2026
      # en jouant `--strict` pour de vrai sur ce dépôt : le docteur rend
      # « 0 défaut(s), 1 dette(s) », et `--strict` échoue sur une dette
      # (pwa-doctor.mjs:1631). Ce qui bloque aujourd'hui :
      #   · code source + soutien sur tous les écrans, rendus par la coquille
      # Le mode strict s'active quand cette liste est vide. Pas avant : une CI
      # rouge sur une dette connue et non traitée n'apprend rien à personne.
      run-e2e: true
      # TOUTE la suite, pas un sous-ensemble. Mesuré le 06/09/2026 : le défaut
      # du socle (`@critical|@a11y`) retient 8 des 11 tests et écarte les trois
      # `@smoke` — dont « navigation vers l'historique », celui qui échouait
      # depuis toujours sur mobile sans que personne le voie. Ce que le filtre
      # ferait gagner : 1,2 s sur un job qui en coûte ~60 (checkout, npm ci,
      # `playwright install --with-deps`, build). Un filtre qui coûte de la
      # couverture et ne rend rien, c'est le mécanisme de pourrissement
      # lui-même : on ne filtre pas.
      e2e-grep: '.*'
      # Le bureau ET le téléphone. C'est ICI que le bug a vécu : sous le seuil
      # `md`, la barre latérale disparaît et le tiroir est fermé — deux tests
      # échouaient sur Pixel 5 et iPhone 12 depuis toujours, sur une CI qui ne
      # jouait rien. Le socle refusait de nommer un projet mobile jusqu'à la
      # 4.5.2 (`playwright install mobile-chrome` : « Invalid installation
      # targets ») ; il accepte désormais une liste et déduit les navigateurs.
      #
      # `mobile-chrome` et pas les cinq : Pixel 5 tourne sur le chromium déjà
      # installé, donc il coûte 7 s de tests et aucun téléchargement, tandis
      # que `mobile-safari` demanderait webkit en plus — pour un moteur que la
      # CI ne joue nulle part ailleurs, même en bureau. La CI couvre un moteur
      # à deux largeurs ; la matrice locale (`npm run test:e2e`, 55 tests sur
      # cinq navigateurs) reste l'endroit où les cinq tournent.
      e2e-project: 'chromium mobile-chrome'
      # Second avis TypeScript 7, NON BLOQUANT. La 6 reste la référence : c'est
      # elle que typescript-eslint résout, et il refuse la 7.0 par une assertion
      # à l'import. Le jour où typescript-eslint#10940 se ferme, cette entrée
      # et l'alias `typescript-7` disparaissent ensemble.
      run-type-check-7: true
