# CI déléguée au reusable workflow famille (dev-wpa-config).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Le workflow réutilisé épingle actions/checkout@v4 et actions/setup-node@v4
# (Node.js 20, deprecation juin 2026). Tant que `pwa-ci.yml` n'a pas été
# bumpé côté `dev-wpa-config`, on autorise l'exécution sur Node 24 via la
# variable d'environnement runner. Lorsqu'une v2 du workflow famille
# existera, basculer le tag `@v1` → `@v2` et retirer ce bloc env.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-ci.yml@v1
    secrets: inherit
    with:
      run-e2e: false
