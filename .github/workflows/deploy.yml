# Deploy délégué au reusable workflow famille (dev-pwa-config).
# Les permissions doivent être déclarées au niveau caller (intersection only).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

# NB : ne PAS déclarer `concurrency: pages` ici. Le reusable `pwa-deploy.yml`
# l'a déjà → un caller qui répète le même groupe provoque un deadlock
# ("Canceling since a deadlock was detected for concurrency group: 'pages'").

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
