# Deploy délégué au reusable workflow famille (dev-wpa-config).
# Les permissions doivent être déclarées au niveau caller (intersection only).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

# NB : ne PAS déclarer `concurrency: pages` ici. Le reusable `pwa-deploy.yml`
# l'a déjà → un caller qui répète le même groupe provoque un deadlock
# ("Canceling since a deadlock was detected for concurrency group: 'pages'").

jobs:
  deploy:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-deploy.yml@v3
    secrets: inherit
    with:
      use-base-path: true
