name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mister-guiiug'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          # LHCI sert dist/ à la racine ; pas de préfixe `/miss-badminton/`.
          VITE_BASE_PATH: /
        run: npm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          # Le runner sert le build via http-server pour mesurer la prod.
          uploadArtifacts: true
          temporaryPublicStorage: true
